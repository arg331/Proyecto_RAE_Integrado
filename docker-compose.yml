
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: rae_user
      POSTGRES_PASSWORD: rae_password
      POSTGRES_DB: rae_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rae_user -d rae_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rae_db
      SPRING_DATASOURCE_USERNAME: rae_user
      SPRING_DATASOURCE_PASSWORD: rae_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend